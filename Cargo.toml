[package]
name = "hammerspace"
description = "A plugin for the loading and management of levels and objects, and their physical properties"
repository = "https://github.com/KyWinston/hammerspace"
version = "0.4.2"
authors = ["Ky Winston<kwinston@proton.me>"]
edition = "2024"
exclude = ["assets/*", "examples/*", "**/bin", "*_template"]
license = "MIT OR Apache-2.0"
keywords = ["bevy"]
publish = true

[dependencies]
bevy = { version = "0.16.0", default-features = false, features = [
    "bevy_asset",
    "bevy_scene",
    "bevy_state",
    "bevy_sprite",
    "bevy_gltf",
] }
serde = "1.0.195"
cfg-if = "1.0.0"
vleue_navigator = { version = "0.11.1", optional = true }
clap = { version = "4.5.*", optional = true }
bitflags = { version = "2.5.0", optional = true }
sickle_ui = { version = "0.4.0", optional = true }
baby_shark = { version = "0.3.3", optional = true }
stl_io = { version = "0.8.5", optional = true }
image = { version = "0.25.*" }
rand = "0.9.0"
iyes_progress = { version = "0.13.1", optional = true }
bevy_copperfield = { version = "0.2.2", optional = true }
nalgebra = "0.33.2"
palette = "0.7.6"
enterpolation = "0.2.1"
# bevy_skein="0.2.0"
bevy_skein = { git = "https://github.com/rust-adventure/skein", branch = "main" }

[target.'cfg(target_os = "linux")'.dev-dependencies.bevy]
version = "0.16.0"
features = ["x11", "wayland", "bevy_winit"]
default-features = true

[dev-dependencies]
bevy = { version = "0.16.0", default-features = false, features = [
    "file_watcher",
    "bevy_render",
    "trace",
    "dynamic_linking",
] }
bevy-inspector-egui = "0.30.0"
bevy_third_person_camera = "0.2.1"

[features]
default = []
pathfind = ["dep:vleue_navigator"]
proc_terrain = ["dep:baby_shark", "dep:bevy_copperfield", "dep:stl_io"]
debug = []
load_progress = ["dep:iyes_progress"]

# Enable a small amount of optimization in debug mode
[profile.dev]
opt-level = 1

# Enable high optimizations for dependencies (incl. Bevy), but not for our code:
[profile.dev.package."*"]
opt-level = 3
